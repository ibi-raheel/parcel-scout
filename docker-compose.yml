version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: parcelscout-db
    environment:
      POSTGRES_DB: parcelscout
      POSTGRES_USER: parcelscout
      POSTGRES_PASSWORD: parcelscout_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcelscout"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: parcelscout-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
